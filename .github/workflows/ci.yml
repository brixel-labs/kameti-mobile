name: CI

# Runs only for the develop and main branches (after a merge), plus manual runs.
# macOS minutes cost about 10x Linux minutes on private repos, so PRs aren't built here.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: KametiKit tests
        working-directory: ios/KametiKit
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in d for x in d[k] if 'iPhone' in x['name']))")
          xcodebuild test -scheme KametiKit-Package -destination "id=$SIM" | tail -40
